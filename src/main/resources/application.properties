spring.application.name=trackflow-logistics

# Render (y cualquier PaaS) inyecta el puerto por la variable PORT.
server.port=${PORT:8083}
# Render termina HTTPS en su proxy y reenvía por HTTP; con esto la aplicación sabe que la
# petición original fue HTTPS.
server.forward-headers-strategy=framework

# Base única de Supabase, compartida por las tres APIs. Esta API usa las tablas logistics_*
# y lee cities, auth_users y auth_sessions (en esta última solo renueva la actividad).
spring.datasource.url=${TRACKFLOW_DB_URL:jdbc:postgresql://localhost:5432/trackflow}
spring.datasource.username=${TRACKFLOW_DB_USER:postgres}
spring.datasource.password=${TRACKFLOW_DB_PASSWORD:postgres}
# El plan gratuito de Supabase admite unas 15 conexiones para las tres APIs.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# El esquema es de la API de Envíos y acceso (Flyway V1 a V22): esta API no migra, solo
# verifica que sus entidades coincidan con las tablas. Por eso se despliega después.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=false

# Las tres APIs usan el mismo broker y el mismo vhost: es por donde viajan los eventos.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL:false}
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.prefetch=1
# Un fallo pasajero (la base ocupada, por ejemplo) se reintenta antes de mandar el mensaje
# a la cola de descartados.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=4
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=8000ms

# Contrato de eventos entre las tres APIs. No cambia sin avisar a los otros responsables.
trackflow.events.exchange=${TRACKFLOW_EVENTS_EXCHANGE:trackflow.events}
trackflow.events.shipment-created-key=${TRACKFLOW_SHIPMENT_CREATED_KEY:shipment.created}
trackflow.events.logistics-registered-key=${TRACKFLOW_LOGISTICS_REGISTERED_KEY:logistics.event.registered}
trackflow.logistics.events.shipment-created-queue=${TRACKFLOW_LOGISTICS_SHIPMENT_QUEUE:trackflow.logistics.shipment-created}
trackflow.logistics.events.dead-letter-exchange=${TRACKFLOW_LOGISTICS_DLX:trackflow.logistics.dlx}
trackflow.logistics.events.dead-letter-queue=${TRACKFLOW_LOGISTICS_DLQ:trackflow.logistics.events.dlq}

# Los tokens los emite la API de Envíos y acceso; aquí se verifican con el mismo secreto.
trackflow.security.enabled=${TRACKFLOW_SECURITY_ENABLED:true}
trackflow.security.jwt-secret=${TRACKFLOW_JWT_SECRET:}
trackflow.security.inactividad-minutos=${TRACKFLOW_INACTIVIDAD_MINUTOS:30}

# Orígenes que pueden llamar a la API desde un navegador, separados por comas.
trackflow.cors.allowed-origins=${TRACKFLOW_CORS_ORIGINS:http://localhost:5173}

spring.mvc.problemdetails.enabled=true
server.error.include-message=always

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=${TRACKFLOW_SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${TRACKFLOW_SWAGGER_ENABLED:true}
